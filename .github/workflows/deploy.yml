name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - server
          - client
          - both

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show selected service
        run: |
          echo "Selected service: ${{inputs.service}}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Verify Docker
        run: docker info

      - name: Build server image
        run: |
          docker build \
            -t ${{secrets.DOCKERHUB_USERNAME}}/graphql-server:${{github.sha}} \
            ./server

      - name: Build Client image
        run: |
          docker build \
            --build-arg VITE_GRAPHQL_API_URL="${{secrets.VITE_GRAPHQL_API_URL}}" \
            -t ${{secrets.DOCKERHUB_USERNAME}}/graphql-client:${{github.sha}} \
            ./client

      - name: Verify docker images
        run: docker images
