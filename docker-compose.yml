services:
  server:
    build:
      context: ./server
    image: graphql-server:latest
    container_name: graphql-server
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        - VITE_GRAPHQL_API_URL=http://localhost:4000/graphql
    image: graphql-client:latest
    container_name: graphql-client
    ports:
      - "3000:80"
    depends_on:
      - server
