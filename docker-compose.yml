services:
  server:
    build:
      context: ./server
    image: graphql-server:1.0.0
    container_name: graphql-server
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        - VITE_GRAPHQL_API_URL=http://localhost:4000/graphql
    image: graphql-client:1.0.0
    container_name: graphql-client
    ports:
      - "3000:80"
    depends_on:
      - server
